<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tower Defense Game Maker</title>
  
  
  
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo">
        <span class="logo-icon">🏰</span>
        <span class="logo-text">TD Maker</span>
      </div>
      <div class="game-name-wrap">
        <label>게임 이름</label>
        <input type="text" id="gameName" value="내 타워 디펜스" placeholder="게임 이름 입력" />
      </div>
      <div class="top-actions">
        <button id="btnNew" class="btn btn-ghost">🆕 새 프로젝트</button>
        <button id="btnLoad" class="btn btn-ghost">📂 불러오기</button>
        <button id="btnSave" class="btn btn-ghost">💾 저장</button>
        <button id="btnPreview" class="btn btn-primary">▶ 미리보기</button>
        <button id="btnExport" class="btn btn-accent">📦 내보내기</button>
      </div>
    </header>

    <div class="main-layout">
      <nav class="sidebar">
        <button class="nav-item active" data-tab="map">🗺️ 맵 메이커</button>
        <button class="nav-item" data-tab="tower">🗼 타워</button>
        <button class="nav-item" data-tab="enemy">👾 적</button>
        <button class="nav-item" data-tab="upgrade">🌳 업그레이드</button>
        <button class="nav-item" data-tab="difficulty">⚡ 난이도/웨이브</button>
        <button class="nav-item" data-tab="special">⭐ 특별 난이도</button>
        <button class="nav-item" data-tab="menu">🏠 메인메뉴</button>
        <button class="nav-item" data-tab="settings">⚙️ 설정</button>
        <button class="nav-item" data-tab="templates">📋 템플릿</button>
      </nav>

      <main class="content">
        <!-- MAP -->
        <section id="tab-map" class="tab-panel active">
          <div class="panel-header">
            <h2>맵 메이커 <button type="button" class="help-btn" data-help="map">?</button></h2>
            <div class="panel-tools">
              <select id="mapSelect"></select>
              <button id="btnAddMap" class="btn btn-sm btn-primary">+ 맵 추가</button>
              <button id="btnRenameMap" class="btn btn-sm">이름 변경</button>
              <button id="btnDeleteMap" class="btn btn-sm btn-danger">맵 삭제</button>
              <label>가로 <input type="number" id="mapWidth" value="24" min="8" max="50" /></label>
              <label>세로 <input type="number" id="mapHeight" value="16" min="8" max="40" /></label>
              <button id="btnResizeMap" class="btn btn-sm">크기 적용</button>
              <button id="btnClearMap" class="btn btn-sm btn-danger">전체 지우기</button>
              <button type="button" class="help-btn" data-help="multiMap">?</button>
            </div>
          </div>
          <div class="map-editor-layout">
            <div class="tile-palette">
              <h3>타일 팔레트</h3>
              <div class="palette-grid" id="tilePalette"></div>
              <div class="brush-size">
                <label>브러시 크기 <span id="brushSizeVal">1</span></label>
                <input type="range" id="brushSize" min="1" max="5" value="1" />
              </div>
              <div class="map-info">
                <p>좌클릭: 칠하기 / 우클릭: 지우기</p>
                <p>스폰과 엔드를 넣고 경로로 연결하세요.</p>
              </div>
            </div>
            <div class="map-canvas-wrap">
              <canvas id="mapCanvas"></canvas>
            </div>
          </div>
        </section>

        <!-- TOWER -->
        <section id="tab-tower" class="tab-panel">
          <div class="panel-header">
            <h2>타워 생성기 <button type="button" class="help-btn" data-help="tower">?</button></h2>
            <button id="btnAddTower" class="btn btn-primary btn-sm">+ 새 타워</button>
          </div>
          <div class="editor-layout">
            <div class="list-panel"><div id="towerList" class="item-list"></div></div>
            <div class="detail-panel" id="towerDetail"><p class="placeholder">타워를 선택하거나 새로 만드세요.</p></div>
          </div>
        </section>

        <!-- ENEMY -->
        <section id="tab-enemy" class="tab-panel">
          <div class="panel-header">
            <h2>적 생성기 <button type="button" class="help-btn" data-help="enemy">?</button></h2>
            <button id="btnAddEnemy" class="btn btn-primary btn-sm">+ 새 적</button>
          </div>
          <div class="editor-layout">
            <div class="list-panel"><div id="enemyList" class="item-list"></div></div>
            <div class="detail-panel" id="enemyDetail"><p class="placeholder">적을 선택하거나 새로 만드세요.</p></div>
          </div>
        </section>

        <!-- UPGRADE -->
        <section id="tab-upgrade" class="tab-panel">
          <div class="panel-header">
            <h2>업그레이드 트리 <button type="button" class="help-btn" data-help="upgrade">?</button>
              <button type="button" class="help-btn" data-help="rootNode" title="루트 노드란?">루트?</button>
            </h2>
            <div class="panel-tools">
              <select id="upgradeTowerSelect"></select>
              <button id="btnAddUpgradeNode" class="btn btn-sm">+ 노드 추가</button>
              <button id="btnClearTree" class="btn btn-sm btn-danger">트리 초기화</button>
            </div>
          </div>
          <div class="upgrade-layout">
            <div class="upgrade-canvas-wrap"><canvas id="upgradeCanvas"></canvas></div>
            <div class="upgrade-sidebar" id="upgradeNodeDetail"><p class="placeholder">노드를 선택하세요.</p></div>
          </div>
        </section>

        <!-- DIFFICULTY -->
        <section id="tab-difficulty" class="tab-panel">
          <div class="panel-header">
            <h2>난이도 & 웨이브 <button type="button" class="help-btn" data-help="difficulty">?</button></h2>
            <button id="btnAddDifficulty" class="btn btn-primary btn-sm">+ 난이도 추가</button>
          </div>
          <div id="difficultyList" class="difficulty-accordion"></div>
        </section>

        <!-- SPECIAL -->
        <section id="tab-special" class="tab-panel">
          <div class="panel-header">
            <h2>특별 난이도 <button type="button" class="help-btn" data-help="special">?</button></h2>
            <button id="btnAddSpecial" class="btn btn-primary btn-sm">+ 특별 난이도 추가</button>
          </div>
          <div class="editor-layout">
            <div class="list-panel"><div id="specialList" class="item-list"></div></div>
            <div class="detail-panel" id="specialDetail"><p class="placeholder">특별 난이도를 선택하거나 새로 만드세요.</p></div>
          </div>
        </section>

        <!-- MAIN MENU -->
        <section id="tab-menu" class="tab-panel">
          <div class="panel-header">
            <h2>메인메뉴 편집 <button type="button" class="help-btn" data-help="mainMenu">?</button></h2>
          </div>
          <div class="menu-editor-layout">
            <div class="menu-form" id="menuForm"></div>
            <div class="menu-preview" id="menuPreview"></div>
          </div>
        </section>

        <!-- SETTINGS -->
        <section id="tab-settings" class="tab-panel">
          <div class="panel-header"><h2>게임 설정</h2></div>
          <div class="settings-grid">
            <div class="setting-card">
              <h3>기본 정보</h3>
              <label>제작자 <input type="text" id="authorName" value="Anonymous" /></label>
              <label>버전 <input type="text" id="gameVersion" value="1.0.0" /></label>
              <label>설명 <textarea id="gameDesc" rows="3"></textarea></label>
            </div>
            <div class="setting-card">
              <h3>플레이 설정</h3>
              <label>타일 크기(px) <input type="number" id="tileSize" value="48" min="24" max="72" /></label>
              <label>최대 타워 수 <input type="number" id="maxTowers" value="50" min="10" /></label>
              <label><input type="checkbox" id="allowSell" checked /> 타워 판매 허용</label>
              <label><input type="checkbox" id="showPath" checked /> 경로 미리보기</label>
            </div>
            <div class="setting-card">
              <h3>시각</h3>
              <label>배경색 <input type="color" id="bgColor" value="#1a1a2e" /></label>
              <label>경로색 <input type="color" id="pathColor" value="#4a4a6a" /></label>
              <label><input type="checkbox" id="enableParticles" checked /> 파티클</label>
            </div>
          </div>
        </section>

        <!-- TEMPLATES -->
        <section id="tab-templates" class="tab-panel">
          <div class="panel-header"><h2>템플릿</h2></div>
          <div class="templates-grid" id="templatesGrid"></div>
        </section>
      </main>
    </div>

    <footer class="statusbar">
      <span id="statusText">준비됨</span>
      <span id="projectInfo">타워 0 · 적 0 · 난이도 0</span>
    </footer>
  </div>

  <!-- Help popover -->
  <div id="helpPopover" class="help-popover hidden">
    <div class="help-popover-inner">
      <button type="button" class="help-close" id="helpClose">✕</button>
      <div id="helpBody"></div>
    </div>
  </div>

  <!-- Preview -->
  <div id="previewOverlay" class="modal-overlay hidden">
    <div class="preview-modal">
      <div class="preview-header">
        <h2>게임 미리보기</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="previewDiffSelect"></select>
          <button id="btnClosePreview" class="btn btn-ghost">✕ 닫기</button>
        </div>
      </div>
      <div class="preview-body">
        <canvas id="previewCanvas"></canvas>
        <div class="preview-hud">
          <div>💰 <span id="pGold">0</span></div>
          <div>❤️ <span id="pLives">0</span></div>
          <div>🌊 <span id="pWave">0</span></div>
          <div class="preview-controls">
            <button id="btnStartWave" class="btn btn-sm btn-primary">다음 웨이브</button>
            <button id="btnPausePreview" class="btn btn-sm">일시정지</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Export -->
  <div id="exportOverlay" class="modal-overlay hidden">
    <div class="modal export-modal">
      <h2>내보내기</h2>
      <div class="export-options">
        <button id="btnDownloadJSON" class="btn btn-primary">📄 JSON 다운로드</button>
        <button id="btnDownloadHTML" class="btn btn-accent">🌐 플레이 HTML 다운로드</button>
        <button id="btnCopyCode" class="btn btn-ghost">📋 코드 복사</button>
      </div>
      <textarea id="exportCode" readonly rows="12"></textarea>
      <button id="btnCloseExport" class="btn btn-ghost" style="margin-top:12px">닫기</button>
    </div>
  </div>

  
<style>
:root {
  --bg: #0f0f1a;
  --bg2: #16162a;
  --bg3: #1e1e36;
  --border: #2a2a4a;
  --text: #e8e8f0;
  --text2: #a0a0c0;
  --primary: #6c5ce7;
  --primary-hover: #7f71ef;
  --accent: #00cec9;
  --danger: #e17055;
  --radius: 10px;
  --font: 'Noto Sans KR', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  font-size: 16px;
}
#app { display: flex; flex-direction: column; height: 100vh; }
.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 14px 20px; background: var(--bg2);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.35rem; }
.logo-icon { font-size: 1.6rem; }
.game-name-wrap { display: flex; align-items: center; gap: 10px; flex: 1; }
.game-name-wrap label { color: var(--text2); font-size: 0.95rem; }
.game-name-wrap input {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 10px 14px; border-radius: var(--radius); font-size: 1.05rem; width: 260px;
}
.top-actions { display: flex; gap: 10px; }
.btn {
  border: none; border-radius: var(--radius); padding: 10px 16px;
  font-family: var(--font); font-size: 0.95rem; font-weight: 500;
  cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-sm { padding: 8px 12px; font-size: 0.9rem; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-accent { background: var(--accent); color: #0f0f1a; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg3); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.main-layout { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 200px; background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 14px 10px; gap: 6px; flex-shrink: 0;
}
.nav-item {
  background: transparent; border: none; color: var(--text2); text-align: left;
  padding: 14px 14px; border-radius: var(--radius); cursor: pointer;
  font-family: var(--font); font-size: 1rem;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--primary); color: #fff; font-weight: 500; }
.content { flex: 1; overflow: auto; background: var(--bg); }
.tab-panel { display: none; padding: 20px 24px; height: 100%; flex-direction: column; }
.tab-panel.active { display: flex; }
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; flex-shrink: 0; flex-wrap: wrap; gap: 12px;
}
.panel-header h2 { font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
.panel-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel-tools label { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; color: var(--text2); }
.panel-tools input[type="number"] {
  width: 64px; background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 0.95rem;
}
.panel-tools select {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; min-width: 140px;
}
.help-btn {
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--accent);
  background: transparent; color: var(--accent); font-weight: 700; font-size: 0.85rem;
  cursor: pointer; line-height: 1; padding: 0; flex-shrink: 0;
}
.help-btn:hover { background: var(--accent); color: #0f0f1a; }
.help-popover {
  position: fixed; z-index: 2000; max-width: 360px; background: var(--bg3);
  border: 1px solid var(--accent); border-radius: 12px; padding: 16px 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5); font-size: 0.95rem; line-height: 1.55; color: var(--text);
}
.help-popover.hidden { display: none; }
.help-popover-inner { position: relative; padding-right: 20px; }
.help-close {
  position: absolute; top: -4px; right: -4px; background: transparent; border: none;
  color: var(--text2); cursor: pointer; font-size: 1rem;
}
.map-editor-layout { display: flex; gap: 18px; flex: 1; min-height: 0; }
.tile-palette {
  width: 180px; flex-shrink: 0; background: var(--bg2); border-radius: var(--radius);
  padding: 14px; border: 1px solid var(--border);
}
.tile-palette h3 { font-size: 1rem; margin-bottom: 12px; color: var(--text2); }
.palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.tile-btn {
  aspect-ratio: 1; border: 2px solid transparent; border-radius: 8px; cursor: pointer;
  font-size: 0.8rem; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px; color: #fff;
}
.tile-btn.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.brush-size label { font-size: 0.9rem; color: var(--text2); display: block; margin-bottom: 6px; }
.brush-size input { width: 100%; }
.map-info { font-size: 0.85rem; color: var(--text2); line-height: 1.5; margin-top: 12px; }
.map-canvas-wrap {
  flex: 1; overflow: auto; background: var(--bg2); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 16px;
}
#mapCanvas { cursor: crosshair; image-rendering: pixelated; }
.editor-layout { display: flex; gap: 18px; flex: 1; min-height: 0; }
.list-panel {
  width: 260px; flex-shrink: 0; background: var(--bg2); border-radius: var(--radius);
  border: 1px solid var(--border); overflow-y: auto;
}
.item-list { padding: 10px; }
.item-card {
  padding: 14px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
  border: 1px solid transparent; display: flex; align-items: center; gap: 12px;
}
.item-card:hover { background: var(--bg3); }
.item-card.active { background: var(--bg3); border-color: var(--primary); }
.item-card .icon { font-size: 1.6rem; width: 36px; text-align: center; }
.item-card .name { font-weight: 500; font-size: 1rem; }
.item-card .meta { font-size: 0.85rem; color: var(--text2); }
.detail-panel {
  flex: 1; background: var(--bg2); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 24px; overflow-y: auto;
}
.detail-panel .placeholder {
  color: var(--text2); text-align: center; padding: 48px 20px; line-height: 1.6; font-size: 1.05rem;
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.span2 { grid-column: span 2; }
.form-group label { font-size: 0.9rem; color: var(--text2); }
.form-group input, .form-group select, .form-group textarea {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 10px 12px; border-radius: 8px; font-family: var(--font); font-size: 1rem;
}
.form-group input[type="color"] { height: 42px; padding: 3px; cursor: pointer; }
.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 1rem; }
.emoji-preview {
  font-size: 3.5rem; width: 90px; height: 90px; background: var(--bg);
  border-radius: 12px; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.section-title {
  font-size: 1.05rem; margin: 22px 0 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border); color: var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.btn-row { display: flex; gap: 10px; margin-top: 18px; }
.upgrade-layout { display: flex; gap: 18px; flex: 1; min-height: 0; }
.upgrade-canvas-wrap {
  flex: 1; background: var(--bg2); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: auto;
}
#upgradeCanvas { cursor: grab; display: block; }
.upgrade-sidebar {
  width: 300px; flex-shrink: 0; background: var(--bg2); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 18px; overflow-y: auto;
}
.difficulty-accordion { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; }
.diff-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
}
.diff-card-header {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  cursor: pointer; background: var(--bg3); user-select: none;
}
.diff-card-header:hover { filter: brightness(1.05); }
.diff-card-header .chevron { transition: transform 0.2s; color: var(--text2); }
.diff-card.collapsed .chevron { transform: rotate(-90deg); }
.diff-card-header strong { font-size: 1.1rem; flex: 1; }
.diff-card-body { padding: 18px; border-top: 1px solid var(--border); }
.diff-card.collapsed .diff-card-body { display: none; }
.diff-settings-row {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.diff-settings-row label {
  display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--text2);
}
.diff-settings-row input, .diff-settings-row select {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 8px 10px; border-radius: 6px; font-size: 0.95rem;
}
.wave-list { display: flex; flex-direction: column; gap: 10px; }
.wave-card {
  background: var(--bg3); border-radius: 10px; padding: 14px; border: 1px solid var(--border);
}
.wave-card-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
}
.wave-entry {
  display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 0.95rem;
}
.wave-entry select, .wave-entry input {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 6px 8px; border-radius: 6px; font-size: 0.9rem;
}
.wave-entry select { flex: 1; }
.wave-entry input { width: 70px; }
.menu-editor-layout {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; min-height: 0;
}
.menu-form {
  background: var(--bg2); border-radius: var(--radius); border: 1px solid var(--border);
  padding: 20px; overflow-y: auto;
}
.menu-preview {
  background: #0a0a14; border-radius: var(--radius); border: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px; min-height: 360px; text-align: center;
}

/* ==== mapEditor.js ==== */
class MapEditor {
  constructor(canvas, project, onChange) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.project = project;
    this.onChange = onChange;
    this.selectedTile = TILES.path.id;
    this.brushSize = 1;
    this.isDrawing = false;
    this.drawValue = null;
    this.tileSize = 36;
    this._bindEvents();
    this.resize();
  }

  _bindEvents() {
    this.canvas.addEventListener('mousedown', (e) => this._onDown(e));
    this.canvas.addEventListener('mousemove', (e) => this._onMove(e));
    this.canvas.addEventListener('mouseup', () => this._onUp());
    this.canvas.addEventListener('mouseleave', () => this._onUp());
    this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  setProject(project) {
    this.project = project;
    syncActiveMap(project);
    this.resize();
    this.render();
  }

  get map() {
    return this.project.map;
  }

  resize() {
    const { width, height } = this.map;
    this.canvas.width = width * this.tileSize;
    this.canvas.height = height * this.tileSize;
    this.render();
  }

  setSelectedTile(id) { this.selectedTile = id; }
  setBrushSize(s) { this.brushSize = s; }

  clear() {
    this.map.tiles = createEmptyMap(this.map.width, this.map.height);
    this.render();
    this.onChange?.();
  }

  applySize(w, h) {
    const old = this.map.tiles;
    const tiles = createEmptyMap(w, h);
    for (let y = 0; y < Math.min(h, old?.length || 0); y++) {
      for (let x = 0; x < Math.min(w, old[y]?.length || 0); x++) {
        tiles[y][x] = old[y][x];
      }
    }
    this.map.width = w;
    this.map.height = h;
    this.map.tiles = tiles;
    this.resize();
    this.onChange?.();
  }

  _pos(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / this.tileSize);
    const y = Math.floor((e.clientY - rect.top) / this.tileSize);
    return { x, y };
  }

  _paint(x, y, value) {
    const { width, height, tiles } = this.map;
    const r = Math.floor(this.brushSize / 2);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < width && ny < height) tiles[ny][nx] = value;
      }
    }
  }

  _onDown(e) {
    this.isDrawing = true;
    const { x, y } = this._pos(e);
    this.drawValue = e.button === 2 ? TILES.grass.id : this.selectedTile;
    this._paint(x, y, this.drawValue);
    this.render();
  }
  _onMove(e) {
    if (!this.isDrawing) return;
    const { x, y } = this._pos(e);
    this._paint(x, y, this.drawValue);
    this.render();
  }
  _onUp() {
    if (this.isDrawing) { this.isDrawing = false; this.onChange?.(); }
  }

  render() {
    const { width, height, tiles } = this.map;
    const ts = this.tileSize;
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const tid = tiles[y][x];
        const tile = Object.values(TILES).find(t => t.id === tid) || TILES.grass;
        ctx.fillStyle = tile.color;
        ctx.fillRect(x * ts, y * ts, ts, ts);
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.strokeRect(x * ts, y * ts, ts, ts);
        if (tile.symbol && tid !== TILES.grass.id) {
          ctx.font = `${Math.floor(ts * 0.45)}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(tile.symbol, x * ts + ts / 2, y * ts + ts / 2);
        }
      }
    }
  }

  findPath() {
    const { width, height, tiles } = this.map;
    const walkable = new Set([TILES.path.id, TILES.spawn.id, TILES.end.id]);
    let start = null, end = null;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (tiles[y][x] === TILES.spawn.id) start = { x, y };
        if (tiles[y][x] === TILES.end.id) end = { x, y };
      }
    }
    if (!start || !end) return null;
    const key = (p) => `${p.x},${p.y}`;
    const queue = [start];
    const came = new Map();
    came.set(key(start), null);
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    while (queue.length) {
      const cur = queue.shift();
      if (cur.x === end.x && cur.y === end.y) {
        const path = [];
        let c = cur;
        while (c) { path.push(c); c = came.get(key(c)); }
        return path.reverse();
      }
      for (const [dx, dy] of dirs) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
        if (!walkable.has(tiles[ny][nx])) continue;
        const k = `${nx},${ny}`;
        if (came.has(k)) continue;
        came.set(k, cur);
        queue.push({ x: nx, y: ny });
      }
    }
    return null;
  }
}

function renderTilePalette(container, selectedId, onSelect) {
  container.innerHTML = '';
  Object.values(TILES).forEach(tile => {
    const btn = document.createElement('button');
    btn.className = 'tile-btn' + (tile.id === selectedId ? ' active' : '');
    btn.style.background = tile.color;
    btn.innerHTML = `${tile.symbol}<span>${tile.name}</span>`;
    btn.onclick = () => onSelect(tile.id);
    container.appendChild(btn);
  });
}

    this.detailEl = detailEl;
    this.project = project;
    this.onChange = onChange;
    this.selectedId = null;

    this.project = project;
    this.selectedId = null;
    this.renderList();
    this.renderDetail();

    const id = this.project.towers.length
      ? Math.max(...this.project.towers.map(t => t.id)) + 1 : 1;
    const tower = createDefaultTower(id);
    this.project.towers.push(tower);
    this.selectedId = id;
    this.renderList();
    this.renderDetail();
    this.onChange?.();

    this.project.towers = this.project.towers.filter(t => t.id !== id);
    if (this.project.upgradeTrees[id]) delete this.project.upgradeTrees[id];
    if (this.selectedId === id) this.selectedId = null;
    this.renderList();
    this.renderDetail();
    this.onChange?.();

        if (field === 'effectType' || field === 'effectValue') {

          const value = parseFloat(this.detailEl.querySelector('[data-field="effectValue"]').value) || 0;
          t.effects = type ? [{ type, value }] : [];

        else t[field] = el.value;

          const prev = this.detailEl.querySelector('#towerEmojiPrev');

      btn.onclick = () => {

        this.renderDetail();
        this.renderList();
        this.onChange?.();

        e.stopPropagation();
        window.dispatchEvent(new CustomEvent('td-help', { detail: { key: b.dataset.help, el: b } }));
      };
    });
  }

  ghost: ['👻','💀','🌫️','👤','🔮'],
  boss: ['👑','🐉','🦖','👹','🤖'],
};

  constructor(listEl, detailEl, project, onChange) {
    this.listEl = listEl;
    this.detailEl = detailEl;
    this.project = project;
    this.onChange = onChange;
    this.selectedId = null;
  }

  setProject(project) {
    this.project = project;
    this.selectedId = null;
    this.renderList();
    this.renderDetail();
  }

  addEnemy() {
    const id = this.project.enemies.length
      ? Math.max(...this.project.enemies.map(e => e.id)) + 1 : 1;

    this.project.enemies.push(enemy);

/* ==== upgradeTree.js ==== */
/**
 * Branching upgrade tree editor (canvas-based node graph)
 */
class UpgradeTreeEditor {
  constructor(canvas, detailEl, project, onChange) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.detailEl = detailEl;
    this.project = project;
    this.onChange = onChange;
    this.towerId = null;
    this.selectedNodeId = null;
    this.dragging = null;
    this.offset = { x: 0, y: 0 };
    this.scale = 1;
    this.connectingFrom = null;
    this.nodeRadius = 28;

    this._bind();
    this._resize();
  }

  _bind() {
    this.canvas.addEventListener('mousedown', (e) => this._onDown(e));
    this.canvas.addEventListener('mousemove', (e) => this._onMove(e));
    this.canvas.addEventListener('mouseup', (e) => this._onUp(e));
    this.canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.scale = Math.max(0.5, Math.min(2, this.scale - e.deltaY * 0.001));
      this.render();
    }, { passive: false });
    window.addEventListener('resize', () => this._resize());
  }

  _resize() {
    const wrap = this.canvas?.parentElement;
    this.canvas.width = (wrap && wrap.clientWidth) || 800;
    this.canvas.height = Math.max(500, (wrap && wrap.clientHeight) || 500);
    this.render();
  }

  setProject(project) {
    this.project = project;
    this.towerId = null;
    this.selectedNodeId = null;
    this.render();
    this.renderDetail();
  }

  setTower(towerId) {
    this.towerId = towerId;
    if (towerId && !this.project.upgradeTrees[towerId]) {
      this.project.upgradeTrees[towerId] = { nodes: [], edges: [] };
    }
    this.selectedNodeId = null;
    this.render();
    this.renderDetail();
  }

  getTree() {
    if (!this.towerId) return null;
    return this.project.upgradeTrees[this.towerId];
  }

  addNode() {
    const tree = this.getTree();
    if (!tree) return;
    const id = tree.nodes.length ? Math.max(...tree.nodes.map(n => n.id)) + 1 : 1;
    const node = {
      id,
      x: 150 + (tree.nodes.length % 5) * 120,
      y: 100 + Math.floor(tree.nodes.length / 5) * 100,
      name: `업그레이드 ${id}`,
      cost: 50,
      damageBonus: 5,
      rangeBonus: 0,
      attackSpeedBonus: 0,
      description: '',
      isRoot: tree.nodes.length === 0,
    };
    tree.nodes.push(node);
    this.selectedNodeId = id;
    this.render();
    this.renderDetail();
    this.onChange?.();
  }

  clearTree() {
    if (!this.towerId) return;
    if (!confirm('이 타워의 업그레이드 트리를 초기화할까요?')) return;
    this.project.upgradeTrees[this.towerId] = { nodes: [], edges: [] };
    this.selectedNodeId = null;
    this.render();
    this.renderDetail();
    this.onChange?.();
  }

  _pos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left - this.offset.x) / this.scale,
      y: (e.clientY - rect.top - this.offset.y) / this.scale,
    };
  }

  _hitNode(p) {
    const tree = this.getTree();
    if (!tree) return null;
    for (let i = tree.nodes.length - 1; i >= 0; i--) {
      const n = tree.nodes[i];
      const dx = p.x - n.x, dy = p.y - n.y;
      if (dx * dx + dy * dy <= this.nodeRadius * this.nodeRadius) return n;
    }
    return null;
  }

  _onDown(e) {
    const p = this._pos(e);
    const node = this._hitNode(p);
    if (e.shiftKey && node) {
      // start connection
      this.connectingFrom = node.id;
      return;
    }
    if (node) {
      this.selectedNodeId = node.id;
      this.dragging = { id: node.id, ox: p.x - node.x, oy: p.y - node.y };
      this.renderDetail();
    } else {
      this.selectedNodeId = null;
      this.dragging = { pan: true, sx: e.clientX - this.offset.x, sy: e.clientY - this.offset.y };
      this.renderDetail();
    }
    this.render();
  }

  _onMove(e) {
    if (!this.dragging) {
      if (this.connectingFrom) this.render(); // redraw line preview later if needed
      return;
    }
    if (this.dragging.pan) {
      this.offset.x = e.clientX - this.dragging.sx;
      this.offset.y = e.clientY - this.dragging.sy;
      this.render();
      return;
    }
    const tree = this.getTree();
    const node = tree?.nodes.find(n => n.id === this.dragging.id);
    if (node) {
      const p = this._pos(e);
      node.x = p.x - this.dragging.ox;
      node.y = p.y - this.dragging.oy;
      this.render();
    }
  }

  _onUp(e) {
    if (this.connectingFrom) {
      const p = this._pos(e);
      const target = this._hitNode(p);
      const tree = this.getTree();
      if (target && target.id !== this.connectingFrom && tree) {
        const exists = tree.edges.some(
          ed => ed.from === this.connectingFrom && ed.to === target.id
        );
        if (!exists) {
          tree.edges.push({ from: this.connectingFrom, to: target.id });
          this.onChange?.();
        }
      }
      this.connectingFrom = null;
      this.render();
    }
    this.dragging = null;
  }

  render() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#16162a';
    ctx.fillRect(0, 0, w, h);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    const tree = this.getTree();
    if (!tree) {
      ctx.fillStyle = '#a0a0c0';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('타워를 선택하세요', w / 2, h / 2);
      return;
    }

    ctx.save();
    ctx.translate(this.offset.x, this.offset.y);
    ctx.scale(this.scale, this.scale);

    // edges
    ctx.strokeStyle = '#6c5ce7';
    ctx.lineWidth = 2;
    tree.edges.forEach(ed => {
      const a = tree.nodes.find(n => n.id === ed.from);
      const b = tree.nodes.find(n => n.id === ed.to);
      if (!a || !b) return;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      // arrow
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      const ax = b.x - Math.cos(angle) * this.nodeRadius;
      const ay = b.y - Math.sin(angle) * this.nodeRadius;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - 10 * Math.cos(angle - 0.4), ay - 10 * Math.sin(angle - 0.4));
      ctx.lineTo(ax - 10 * Math.cos(angle + 0.4), ay - 10 * Math.sin(angle + 0.4));
      ctx.closePath();
      ctx.fillStyle = '#6c5ce7';
      ctx.fill();
    });

    // nodes
    tree.nodes.forEach(n => {
      const selected = n.id === this.selectedNodeId;
      ctx.beginPath();
      ctx.arc(n.x, n.y, this.nodeRadius, 0, Math.PI * 2);
      ctx.fillStyle = n.isRoot ? '#00cec9' : '#6c5ce7';
      ctx.fill();
      if (selected) {
        ctx.strokeStyle = '#fdcb6e';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.fillStyle = '#fff';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const label = n.name.length > 8 ? n.name.slice(0, 7) + '…' : n.name;
      ctx.fillText(label, n.x, n.y - 4);
      ctx.font = '10px sans-serif';
      ctx.fillText(`💰${n.cost}`, n.x, n.y + 10);
    });

    ctx.restore();

    // help
    ctx.fillStyle = '#a0a0c0';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('드래그: 이동 · Shift+드래그: 연결 · 휠: 줌 · 빈 곳 드래그: 패닝', 12, h - 12);
  }

  renderDetail() {
    const tree = this.getTree();
    const node = tree?.nodes.find(n => n.id === this.selectedNodeId);
    if (!node) {
      this.detailEl.innerHTML = `
        <p class="placeholder">
          노드를 선택하세요.<br/><br/>
          <strong>조작법</strong><br/>
          · 노드 드래그: 위치 이동<br/>
          · Shift + 노드 클릭 후 다른 노드: 연결<br/>
          · 휠: 확대/축소<br/>
          · 빈 공간 드래그: 패닝
        </p>`;
      return;
    }

    this.detailEl.innerHTML = `
      <div class="form-group" style="margin-bottom:10px;">
        <label>이름</label>
        <input type="text" data-field="name" value="${escapeHtmlUpgrade(node.name)}" />
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label>비용</label>
        <input type="number" data-field="cost" value="${node.cost}" min="0" />
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label>공격력 보너스</label>
        <input type="number" data-field="damageBonus" value="${node.damageBonus}" />
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label>사거리 보너스</label>
        <input type="number" data-field="rangeBonus" value="${node.rangeBonus}" step="0.5" />
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label>공속 보너스</label>
        <input type="number" data-field="attackSpeedBonus" value="${node.attackSpeedBonus}" step="0.1" />
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label>설명</label>
        <textarea data-field="description" rows="2">${escapeHtmlUpgrade(node.description || '')}</textarea>
      </div>
      <label class="checkbox-row" style="margin-bottom:12px;">
        <input type="checkbox" data-field="isRoot" ${node.isRoot ? 'checked' : ''}/> 루트 노드
      </label>
      <div class="btn-row">
        <button class="btn btn-danger btn-sm" id="btnDelNode">노드 삭제</button>
        <button class="btn btn-ghost btn-sm" id="btnDelEdges">연결 끊기</button>
      </div>
    `;

    this.detailEl.querySelectorAll('[data-field]').forEach(el => {
      const field = el.dataset.field;
      el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', () => {
        if (el.type === 'checkbox') node[field] = el.checked;
        else if (el.type === 'number') node[field] = parseFloat(el.value) || 0;
        else node[field] = el.value;
        this.render();
        this.onChange?.();
      });
    });

    this.detailEl.querySelector('#btnDelNode').onclick = () => {
      tree.nodes = tree.nodes.filter(n => n.id !== node.id);
      tree.edges = tree.edges.filter(ed => ed.from !== node.id && ed.to !== node.id);
      this.selectedNodeId = null;
      this.render();
      this.renderDetail();
      this.onChange?.();
    };
    this.detailEl.querySelector('#btnDelEdges').onclick = () => {

class DifficultyEditor {
  constructor(container, project, onChange) {
    this.container = container;
    this.project = project;
    this.onChange = onChange;
  }

  setProject(project) {
    this.project = project;
    this.render();
  }

    const id = this.project.difficulties.length
      ? Math.max(...this.project.difficulties.map(d => d.id)) + 1 : 1;
    this.project.difficulties.push(createDefaultDifficulty(id, `난이도 ${id}`));
    this.render();
    this.onChange?.();
  }

    this.container.innerHTML = '';
    if (!this.project.difficulties?.length) {
      this.container.innerHTML = '<p style="color:var(--text2)">난이도가 없습니다. 추가해보세요.</p>';
      return;
    }

    this.project.difficulties.forEach((diff, idx) => {
      const card = document.createElement('div');
      card.className = 'diff-card' + (diff.collapsed ? ' collapsed' : '');

        `<option value="${m.id}" ${diff.mapId == m.id ? 'selected' : ''}>${escWave(m.name)}</option>`
      ).join('');

      let wavesHtml = (diff.waves || []).map((wave, wi) => {

          <div class="wave-entry" data-wi="${wi}" data-ei="${ei}">
            <select data-f="enemyId">
              <option value="">적 선택</option>
              ${(this.project.enemies || []).map(e =>
                `<option value="${e.id}" ${ent.enemyId == e.id ? 'selected' : ''}>${escWave(e.name)}${e.isBoss?' 👑':''}</option>`
              ).join('')}

            <input type="number" data-f="count" value="${ent.count}" min="1" title="수량" />
            <input type="number" data-f="interval" value="${ent.interval}" min="0.1" step="0.1" title="간격(초)" />
            <button type="button" class="btn btn-ghost btn-sm btn-rm-ent">✕</button>
          </div>`).join('');

          <div class="wave-card" data-wi="${wi}">
            <div class="wave-card-header">
              <strong>${escWave(wave.name)}</strong>
              <div>
                <button type="button" class="btn btn-ghost btn-sm btn-add-ent">+ 적</button>
                <button type="button" class="btn btn-danger btn-sm btn-del-wave">삭제</button>
              </div>
            </div>
            <div style="margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap;">
              <label style="font-size:0.85rem;color:var(--text2)">이름
                <input type="text" data-f="wname" value="${escWave(wave.name)}" style="margin-left:6px;width:120px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;" />
              </label>
              <label style="font-size:0.85rem;color:var(--text2)">보너스
                <input type="number" data-f="bonusGold" value="${wave.bonusGold||0}" min="0" style="margin-left:6px;width:70px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;" />
              </label>
            </div>
            ${entries}
          </div>`;
      }).join('');

      card.innerHTML = `
        <div class="diff-card-header">
          <span class="chevron">▼</span>
          <strong>${escWave(diff.name)}</strong>
          <span style="color:var(--text2);font-size:0.9rem;">웨이브 ${(diff.waves||[]).length}개</span>
          <button type="button" class="btn btn-danger btn-sm btn-del-diff">삭제</button>
        </div>
        <div class="diff-card-body">
          <div class="diff-settings-row">
            <label>이름 <input type="text" data-f="name" value="${escWave(diff.name)}" /></label>
            <label>시작 골드 <input type="number" data-f="startGold" value="${diff.startGold}" min="0" /></label>
            <label>시작 라이프 <input type="number" data-f="startLives" value="${diff.startLives}" min="1" /></label>
            <label>HP 배율 <input type="number" data-f="hpScale" value="${diff.hpScale}" min="0.1" step="0.1" /></label>
            <label>속도 배율 <input type="number" data-f="speedScale" value="${diff.speedScale}" min="0.1" step="0.1" /></label>
            <label>보상 배율 <input type="number" data-f="rewardScale" value="${diff.rewardScale}" min="0.1" step="0.1" /></label>
            <label>맵
              <select data-f="mapId">
                <option value="">기본 맵</option>
                ${mapOpts}
              </select>
            </label>
          </div>

            <h4 style="font-size:1rem;">웨이브 <button type="button" class="help-btn" data-help="wave">?</button></h4>

          <div class="wave-list">${wavesHtml || '<p style="color:var(--text2);font-size:0.9rem;">웨이브 없음</p>'}</div>
        </div>`;

      // toggle
      card.querySelector('.diff-card-header').onclick = (ev) => {
        if (ev.target.closest('button')) return;
        diff.collapsed = !diff.collapsed;
        card.classList.toggle('collapsed', diff.collapsed);
      };

      // settings
      card.querySelectorAll('.diff-settings-row [data-f]').forEach(el => {
        const f = el.dataset.f;
        el.onchange = el.oninput = () => {
          if (f === 'mapId') diff.mapId = el.value ? +el.value : null;
          else if (el.type === 'number') diff[f] = parseFloat(el.value) || 0;
          else {
            diff[f] = el.value;
            card.querySelector('.diff-card-header strong').textContent = diff.name;
          }
          this.onChange?.();
        };
      });

      card.querySelector('.btn-del-diff').onclick = (ev) => {
        ev.stopPropagation();
        if (this.project.difficulties.length <= 1) { alert('최소 1개 난이도가 필요합니다.'); return; }
        if (confirm(`"${diff.name}" 삭제?`)) {
          this.project.difficulties.splice(idx, 1);
          this.render();
          this.onChange?.();
        }
      };

      card.querySelector('.btn-add-wave').onclick = () => {
        if (!diff.waves) diff.waves = [];
        diff.waves.push(createDefaultWave(diff.waves.length));
        this.render();
        this.onChange?.();
      };

      card.querySelectorAll('.wave-card').forEach(wc => {
        const wi = +wc.dataset.wi;
        const wave = diff.waves[wi];
        wc.querySelector('[data-f="wname"]').oninput = (ev) => {
          wave.name = ev.target.value;
          wc.querySelector('.wave-card-header strong').textContent = wave.name;
          this.onChange?.();
        };
        wc.querySelector('[data-f="bonusGold"]').oninput = (ev) => {
          wave.bonusGold = parseInt(ev.target.value) || 0;
          this.onChange?.();
        };
        wc.querySelector('.btn-del-wave').onclick = () => {
          diff.waves.splice(wi, 1);
          this.render();
          this.onChange?.();
        };
        wc.querySelector('.btn-add-ent').onclick = () => {
          wave.entries.push({ enemyId: this.project.enemies[0]?.id || null, count: 5, interval: 0.8 });
          this.render();
          this.onChange?.();
        };
        wc.querySelectorAll('.wave-entry').forEach(row => {
          const ei = +row.dataset.ei;
          row.querySelector('[data-f="enemyId"]').onchange = (ev) => {
            wave.entries[ei].enemyId = ev.target.value ? +ev.target.value : null;
            this.onChange?.();
          };
          row.querySelector('[data-f="count"]').oninput = (ev) => {
            wave.entries[ei].count = parseInt(ev.target.value) || 1;
            this.onChange?.();
          };
          row.querySelector('[data-f="interval"]').oninput = (ev) => {
            wave.entries[ei].interval = parseFloat(ev.target.value) || 0.5;
            this.onChange?.();
          };
          row.querySelector('.btn-rm-ent').onclick = () => {
            wave.entries.splice(ei, 1);
            if (!wave.entries.length) wave.entries.push({ enemyId: null, count: 5, interval: 0.8 });
            this.render();
            this.onChange?.();
          };
        });
      });

      card.querySelectorAll('.help-btn').forEach(b => {
        b.onclick = (ev) => {
          ev.stopPropagation();
          window.dispatchEvent(new CustomEvent('td-help', { detail: { key: b.dataset.help, el: b } }));
        };
      });

      this.container.appendChild(card);
    });
  }
}

      ? Math.max(...this.project.specials.map(s => s.id)) + 1 : 1;

    this.selectedId = id;

    this.listEl.innerHTML = '';

      const card = document.createElement('div');

    this.detailEl.querySelectorAll('[data-f]').forEach(el => {
      const f = el.dataset.f;
      el.oninput = el.onchange = () => {
        if (f === 'rewardTowerId') s[f] = el.value ? +el.value : null;
        else if (el.type === 'number') s[f] = parseFloat(el.value) || 0;

      this.onChange?.();

/**
 * Lightweight playable TD engine for preview & exported HTML
 */
class GameEngine {
  constructor(canvas, project, hud = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.project = project;
    this.hud = hud; // { gold, lives, wave, onGameOver }
    this.tileSize = project.meta.tileSize || 40;
    this.path = [];
    this.enemies = [];
    this.towers = [];
    this.projectiles = [];
    this.particles = [];
    this.gold = project.difficulty.startGold;
    this.lives = project.difficulty.startLives;
    this.waveIndex = -1;
    this.spawning = null;
    this.paused = false;
    this.selectedTowerType = null;
    this.hoverTile = null;
    this.lastTime = 0;
    this.running = false;
    this.bossEnemy = null;

    this._buildPath();
    this._resize();
    this._bind();
  }

  _resize() {
    const { width, height } = this.project.map;
    this.canvas.width = width * this.tileSize;
    this.canvas.height = height * this.tileSize;
  }

  _buildPath() {
    const { width, height, tiles } = this.project.map;
    const walkable = new Set([TILES.path.id, TILES.spawn.id, TILES.end.id]);
    let start = null, end = null;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (tiles[y][x] === TILES.spawn.id) start = { x, y };
        if (tiles[y][x] === TILES.end.id) end = { x, y };
      }
    }
    if (!start || !end) {
      this.path = [];
      return;
    }
    const key = (p) => `${p.x},${p.y}`;
    const queue = [start];
    const came = new Map();
    came.set(key(start), null);
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    while (queue.length) {
      const cur = queue.shift();
      if (cur.x === end.x && cur.y === end.y) {
        const path = [];
        let c = cur;
        while (c) { path.push(c); c = came.get(key(c)); }
        this.path = path.reverse();
        return;
      }
      for (const [dx, dy] of dirs) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
        if (!walkable.has(tiles[ny][nx])) continue;
        const k = `${nx},${ny}`;
        if (came.has(k)) continue;
        came.set(k, cur);
        queue.push({ x: nx, y: ny });
      }
    }
    this.path = [];
  }

  _bind() {
    this.canvas.addEventListener('click', (e) => this._onClick(e));
    this.canvas.addEventListener('mousemove', (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      const x = Math.floor(((e.clientX - rect.left) * scaleX) / this.tileSize);
      const y = Math.floor(((e.clientY - rect.top) * scaleY) / this.tileSize);
      this.hoverTile = { x, y };
    });
  }

  _onClick(e) {
    if (!this.selectedTowerType) return;
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvas.width / rect.width;
    const scaleY = this.canvas.height / rect.height;
    const tx = Math.floor(((e.clientX - rect.left) * scaleX) / this.tileSize);
    const ty = Math.floor(((e.clientY - rect.top) * scaleY) / this.tileSize);
    this.tryPlaceTower(tx, ty, this.selectedTowerType);
  }

  tryPlaceTower(tx, ty, towerDef) {
    const { width, height, tiles } = this.project.map;
    if (tx < 0 || ty < 0 || tx >= width || ty >= height) return false;
    const tid = tiles[ty][tx];
    // cannot place on path/spawn/end/water/block
    if ([TILES.path.id, TILES.spawn.id, TILES.end.id, TILES.water.id, TILES.block.id].includes(tid)) return false;
    if (towerDef.isCliffOnly && tid !== TILES.cliff.id) return false;
    if (!towerDef.isCliffOnly && tid === TILES.cliff.id) {
      // allow non-cliff towers on grass only by default; cliff is special
      // actually allow grass
    }
    if (this.towers.some(t => t.tx === tx && t.ty === ty)) return false;
    if (this.gold < towerDef.cost) return false;
    if (this.towers.length >= (this.project.meta.maxTowers || 50)) return false;

    this.gold -= towerDef.cost;
    this.towers.push({
      ...towerDef,
      tx, ty,
      cooldown: 0,
      upgrades: [],
    });
    this._updateHud();
    return true;
  }

  startNextWave() {
    if (this.spawning) return;
    this.waveIndex++;
    if (this.waveIndex >= this.project.waves.length) {
      // victory
      this.hud.onVictory?.();
      return;
    }
    const wave = this.project.waves[this.waveIndex];
    const queue = [];
    wave.entries.forEach(ent => {
      const def = this.project.enemies.find(e => e.id === ent.enemyId);
      if (!def) return;
      for (let i = 0; i < ent.count; i++) {
        queue.push({ def, delay: ent.interval });
      }
    });
    this.spawning = { queue, timer: 0, index: 0 };
    this._updateHud();
  }

  _spawnEnemy(def) {
    if (!this.path.length) return;
    const hp = def.hp * (this.project.difficulty.hpScale || 1);
    const speed = def.speed * (this.project.difficulty.speedScale || 1);
    const enemy = {
      def,
      hp,
      maxHp: hp,
      speed,
      pathIndex: 0,
      x: this.path[0].x + 0.5,
      y: this.path[0].y + 0.5,
      slow: 0,
      poison: 0,
      facing: 1,
    };
    this.enemies.push(enemy);
    if (def.isBoss) this.bossEnemy = enemy;
  }

  update(dt) {
    if (this.paused || !this.running) return;

    // spawn
    if (this.spawning) {
      this.spawning.timer -= dt;
      if (this.spawning.timer <= 0 && this.spawning.index < this.spawning.queue.length) {
        const item = this.spawning.queue[this.spawning.index++];
        this._spawnEnemy(item.def);
        this.spawning.timer = item.delay;
      }
      if (this.spawning.index >= this.spawning.queue.length && this.spawning.timer <= 0) {
        this.spawning = null;
      }
    }

    // enemies
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      // regen
      if (e.def.regen) e.hp = Math.min(e.maxHp, e.hp + e.def.regen * dt);
      // poison
      if (e.poison > 0) {
        e.hp -= e.poison * dt;
        e.poison -= dt;
      }
      const spd = e.speed * (e.slow > 0 ? 0.5 : 1);
      if (e.slow > 0) e.slow -= dt;

      const target = this.path[e.pathIndex];
      if (!target) {
        this.enemies.splice(i, 1);
        continue;
      }
      const tx = target.x + 0.5, ty = target.y + 0.5;
      const dx = tx - e.x, dy = ty - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.05) {
        e.pathIndex++;
        if (e.pathIndex >= this.path.length) {
          // reached end
          this.lives -= e.def.isBoss ? 5 : 1;
          this.enemies.splice(i, 1);
          if (this.bossEnemy === e) this.bossEnemy = null;
          this._updateHud();
          if (this.lives <= 0) {
            this.running = false;
            this.hud.onGameOver?.();
          }
          continue;
        }
      } else {
        e.x += (dx / dist) * spd * dt;
        e.y += (dy / dist) * spd * dt;
        if (Math.abs(dx) > 0.01) e.facing = dx >= 0 ? 1 : -1;
      }
      if (e.hp <= 0) {
        const reward = Math.floor(e.def.reward * (this.project.difficulty.rewardScale || 1));
        this.gold += reward;
        this.enemies.splice(i, 1);
        if (this.bossEnemy === e) this.bossEnemy = null;
        this._updateHud();
        // particles
        if (this.project.meta.enableParticles) {
          for (let p = 0; p < 6; p++) {
            this.particles.push({
              x: e.x * this.tileSize,
              y: e.y * this.tileSize,
              vx: (Math.random() - 0.5) * 80,
              vy: (Math.random() - 0.5) * 80,
              life: 0.4,
              color: e.def.color,
            });
          }
        }
      }
    }

    // towers attack
    this.towers.forEach(t => {
      t.cooldown -= dt;
      if (t.cooldown > 0) return;
      const range = t.range;
      let best = null, bestDist = Infinity;
      for (const e of this.enemies) {
        // type check
        if (e.def.type === 'ground' && !t.canAttackGround) continue;
        if (e.def.type === 'air' && !t.canAttackAir) continue;
        if (e.def.type === 'ghost' && !t.canAttackGhost) continue;
        const d = Math.hypot(e.x - (t.tx + 0.5), e.y - (t.ty + 0.5));
        if (d <= range && d < bestDist) {
          best = e;
          bestDist = d;
        }
      }
      if (best) {
        t.cooldown = 1 / (t.attackSpeed || 1);
        this.projectiles.push({
          x: t.tx + 0.5,
          y: t.ty + 0.5,
          target: best,
          speed: t.projectileSpeed || 8,
          damage: t.damage,
          color: t.color,
          effects: t.effects || [],
          tower: t,
        });
      }
    });

    // projectiles
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      if (!this.enemies.includes(p.target) || p.target.hp <= 0) {
        this.projectiles.splice(i, 1);
        continue;
      }
      const dx = p.target.x - p.x, dy = p.target.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.15) {
        let dmg = p.damage - (p.target.def.armor || 0);
        if (dmg < 1) dmg = 1;
        p.target.hp -= dmg;
        // effects
        (p.effects || []).forEach(ef => {
          if (ef.type === 'slow') p.target.slow = Math.max(p.target.slow, ef.value || 1);
          if (ef.type === 'poison') p.target.poison = Math.max(p.target.poison, ef.value || 2);
          if (ef.type === 'splash') {
            this.enemies.forEach(oe => {
              if (oe === p.target) return;
              const d = Math.hypot(oe.x - p.target.x, oe.y - p.target.y);
              if (d < 1.2) oe.hp -= dmg * 0.4;
            });
          }
        });
        this.projectiles.splice(i, 1);
      } else {
        p.x += (dx / dist) * p.speed * dt;
        p.y += (dy / dist) * p.speed * dt;
      }
    }

    // particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }

  render() {
    const ctx = this.ctx;
    const ts = this.tileSize;
    const { width, height, tiles } = this.project.map;

    // background
    ctx.fillStyle = this.project.meta.bgColor || '#1a1a2e';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    // tiles
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const tid = tiles[y][x];
        const tile = Object.values(TILES).find(t => t.id === tid) || TILES.grass;
        ctx.fillStyle = tile.color;
        ctx.fillRect(x * ts, y * ts, ts, ts);
      }
    }

    // path highlight
    if (this.project.meta.showPath && this.path.length) {
      ctx.strokeStyle = this.project.meta.pathColor || '#4a4a6a';
      ctx.lineWidth = ts * 0.35;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      this.path.forEach((p, i) => {
        const px = p.x * ts + ts / 2, py = p.y * ts + ts / 2;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
    }

    // towers
    this.towers.forEach(t => {
      const cx = t.tx * ts + ts / 2, cy = t.ty * ts + ts / 2;
      // face nearest enemy
      let face = 1;
      let bestD = Infinity;
      for (const e of this.enemies) {
        const d = Math.hypot(e.x - (t.tx + 0.5), e.y - (t.ty + 0.5));
        if (d < bestD) { bestD = d; face = (e.x >= t.tx + 0.5) ? 1 : -1; }
      }
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(face, 1);
      ctx.font = `${ts * 0.7}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.emoji || '🗼', 0, 0);
      ctx.restore();
    });

    // enemies
    this.enemies.forEach(e => {
      const px = e.x * ts, py = e.y * ts;
      ctx.save();
      ctx.translate(px, py);
      ctx.scale(e.facing || 1, 1);
      ctx.globalAlpha = e.def.type === 'ghost' ? 0.8 : 1;
      ctx.font = `${ts * 0.65}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(e.def.emoji || '👾', 0, 0);
      ctx.globalAlpha = 1;
      ctx.setTransform(1,0,0,1,0,0);
      // hp bar
      const barW = ts * 0.55;
      ctx.fillStyle = '#333';
      ctx.fillRect(px - barW / 2, py - ts * 0.48, barW, 5);
      ctx.fillStyle = e.def.isBoss ? (e.def.bossBarColor || '#e63946') : '#00b894';
      ctx.fillRect(px - barW / 2, py - ts * 0.48, barW * (e.hp / e.maxHp), 5);
      ctx.restore();
    });

    // boss bar (top)
    if (this.bossEnemy && this.bossEnemy.hp > 0) {
      const bw = this.canvas.width * 0.6;
      const bx = (this.canvas.width - bw) / 2;
      const by = 10;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx - 4, by - 4, bw + 8, 22);
      ctx.fillStyle = '#333';
      ctx.fillRect(bx, by, bw, 14);
      ctx.fillStyle = this.bossEnemy.def.bossBarColor || '#e63946';
      ctx.fillRect(bx, by, bw * (this.bossEnemy.hp / this.bossEnemy.maxHp), 14);
      ctx.fillStyle = '#fff';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`👑 ${this.bossEnemy.def.name}`, this.canvas.width / 2, by + 11);
    }

    // projectiles
    this.projectiles.forEach(p => {
      ctx.fillStyle = p.color || '#fdcb6e';
      ctx.beginPath();
      ctx.arc(p.x * ts, p.y * ts, 4, 0, Math.PI * 2);
      ctx.fill();
    });

    // particles
    this.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
      ctx.globalAlpha = 1;
    });

    // hover placement
    if (this.selectedTowerType && this.hoverTile) {
      const { x, y } = this.hoverTile;
      ctx.strokeStyle = 'rgba(0,206,201,0.8)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x * ts + 2, y * ts + 2, ts - 4, ts - 4);
      // range circle
      ctx.beginPath();
      ctx.arc(x * ts + ts / 2, y * ts + ts / 2, this.selectedTowerType.range * ts, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(108,92,231,0.35)';
      ctx.stroke();
    }
  }

  _updateHud() {
    if (this.hud.gold) this.hud.gold.textContent = this.gold;
    if (this.hud.lives) this.hud.lives.textContent = this.lives;
    if (this.hud.wave) this.hud.wave.textContent = `${Math.max(0, this.waveIndex + 1)} / ${this.project.waves.length}`;
  }

  start() {
    this.running = true;
    this.lastTime = performance.now();
    this._updateHud();
    const loop = (now) => {
      if (!this.running) return;
      const dt = Math.min(0.05, (now - this.lastTime) / 1000);
      this.lastTime = now;
      this.update(dt);
      this.render();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  stop() {
    this.running = false;
  }

  togglePause() {
    this.paused = !this.paused;
  }
}



/* ==== export.js ==== */
/**
 * Export project as JSON or standalone playable HTML
 */

function projectToJSON(project) {
  return JSON.stringify(project, null, 2);
}

function downloadJSON(project) {
  const blob = new Blob([projectToJSON(project)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${sanitize(project.meta.name || 'td-game')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function buildPlayableHTML(project) {
  const data = JSON.stringify(project);
  return `<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1"/>

</style>
</head>
<body>
<h1>${escapeHtmlExport(project.meta.name || 'Tower Defense')}</h1>
<p style="color:#a0a0c0;font-size:0.85rem;margin-bottom:8px">${escapeHtmlExport(project.meta.description || '')}</p>
<div class="tower-bar" id="towerBar"></div>
<div class="hud">
  <span>💰 <span id="gold">0</span></span>
  <span>❤️ <span id="lives">0</span></span>
  <span>🌊 <span id="wave">0</span></span>
  <div class="controls">
    <button id="btnWave">다음 웨이브</button>
    <button id="btnPause" class="secondary">일시정지</button>
  </div>
</div>
<div id="gameWrap"><canvas id="c"></canvas></div>
<div id="msg"></div>
<script>
const PROJECT = ${data};

const TILES = {
  grass:0, path:1, cliff:2, water:3, spawn:4, end:5, block:6
};
const TILE_COLORS = {
  0:'#2d6a4f',1:'#6c757d',2:'#8b5e3c',3:'#1d3557',4:'#2a9d8f',5:'#e63946',6:'#343a40'
};

class Game {
  constructor() {
    this.canvas = document.getElementById('c');
    this.ctx = this.canvas.getContext('2d');
    this.ts = PROJECT.meta.tileSize || 40;
    this.path = [];
    this.enemies = [];
    this.towers = [];
    this.projectiles = [];
    this.particles = [];
    this.gold = PROJECT.difficulty.startGold;
    this.lives = PROJECT.difficulty.startLives;
    this.waveIndex = -1;
    this.spawning = null;
    this.paused = false;
    this.selected = null;
    this.hover = null;
    this.running = true;
    this.boss = null;
    this._buildPath();
    this.canvas.width = PROJECT.map.width * this.ts;
    this.canvas.height = PROJECT.map.height * this.ts;
    this._bind();
    this._buildTowerBar();
    this._hud();
    this._loop(performance.now());
  }
  _buildPath() {
    const {width,height,tiles} = PROJECT.map;
    let start=null,end=null;
    for(let y=0;y<height;y++) for(let x=0;x<width;x++){
      if(tiles[y][x]===4) start={x,y};
      if(tiles[y][x]===5) end={x,y};
    }
    if(!start||!end){this.path=[];return;}
    const walk=new Set([1,4,5]);
    const key=p=>p.x+','+p.y;
    const q=[start], came=new Map(); came.set(key(start),null);
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
      const cur=q.shift();
      if(cur.x===end.x&&cur.y===end.y){
        const path=[]; let c=cur; while(c){path.push(c);c=came.get(key(c));}
        this.path=path.reverse(); return;
      }
      for(const [dx,dy] of dirs){
        const nx=cur.x+dx,ny=cur.y+dy;
        if(nx<0||ny<0||nx>=width||ny>=height) continue;
        if(!walk.has(tiles[ny][nx])) continue;
        const k=nx+','+ny; if(came.has(k)) continue;
        came.set(k,cur); q.push({x:nx,y:ny});
      }
    }
    this.path=[];
  }
  _bind(){
    this.canvas.onclick=e=>{
      if(!this.selected) return;
      const r=this.canvas.getBoundingClientRect();
      const sx=this.canvas.width/r.width, sy=this.canvas.height/r.height;
      const tx=Math.floor(((e.clientX-r.left)*sx)/this.ts);
      const ty=Math.floor(((e.clientY-r.top)*sy)/this.ts);
      this.place(tx,ty);
    };
    this.canvas.onmousemove=e=>{
      const r=this.canvas.getBoundingClientRect();
      const sx=this.canvas.width/r.width, sy=this.canvas.height/r.height;
      this.hover={
        x:Math.floor(((e.clientX-r.left)*sx)/this.ts),
        y:Math.floor(((e.clientY-r.top)*sy)/this.ts)
      };
    };
    document.getElementById('btnWave').onclick=()=>this.nextWave();
    document.getElementById('btnPause').onclick=()=>{this.paused=!this.paused;};
  }
  _buildTowerBar(){
    const bar=document.getElementById('towerBar');
    PROJECT.towers.forEach(t=>{
      const b=document.createElement('button');
      b.className='tower-btn';
      b.innerHTML=escapeHtmlExport(t.name)+'<small>💰'+t.cost+' · ⚔️'+t.damage+'</small>';
      b.onclick=()=>{
        document.querySelectorAll('.tower-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        this.selected=t;
      };
      bar.appendChild(b);
    });
  }
  place(tx,ty){
    const t=this.selected; if(!t) return;
    const {width,height,tiles}=PROJECT.map;
    if(tx<0||ty<0||tx>=width||ty>=height) return;
    const tid=tiles[ty][tx];
    if([1,3,4,5,6].includes(tid)) return;
    if(t.isCliffOnly && tid!==2) return;
    if(this.towers.some(x=>x.tx===tx&&x.ty===ty)) return;
    if(this.gold<t.cost) return;
    this.gold-=t.cost;
    this.towers.push({...t,tx,ty,cooldown:0});
    this._hud();
  }
  nextWave(){
    if(this.spawning) return;
    this.waveIndex++;
    if(this.waveIndex>=PROJECT.waves.length){
      document.getElementById('msg').textContent='🎉 승리! 모든 웨이브를 클리어했습니다!';
      this.running=false; return;
    }
    const wave=PROJECT.waves[this.waveIndex];
    const queue=[];
    wave.entries.forEach(ent=>{
      const def=PROJECT.enemies.find(e=>e.id===ent.enemyId);
      if(!def) return;
      for(let i=0;i<ent.count;i++) queue.push({def,delay:ent.interval});
    });
    this.spawning={queue,timer:0,index:0};
    this.gold += wave.bonusGold||0;
    this._hud();
  }
  _spawn(def){
    if(!this.path.length) return;
    const hp=def.hp*(PROJECT.difficulty.hpScale||1);
    const speed=def.speed*(PROJECT.difficulty.speedScale||1);
    const e={def,hp,maxHp:hp,speed,pathIndex:0,x:this.path[0].x+0.5,y:this.path[0].y+0.5,slow:0,poison:0};
    this.enemies.push(e);
    if(def.isBoss) this.boss=e;
  }
  update(dt){
    if(this.paused||!this.running) return;
    if(this.spawning){
      this.spawning.timer-=dt;
      if(this.spawning.timer<=0 && this.spawning.index<this.spawning.queue.length){
        const item=this.spawning.queue[this.spawning.index++];
        this._spawn(item.def);
        this.spawning.timer=item.delay;
      }
      if(this.spawning.index>=this.spawning.queue.length && this.spawning.timer<=0) this.spawning=null;
    }
    for(let i=this.enemies.length-1;i>=0;i--){
      const e=this.enemies[i];
      if(e.def.regen) e.hp=Math.min(e.maxHp,e.hp+e.def.regen*dt);
      if(e.poison>0){e.hp-=e.poison*dt;e.poison-=dt;}
      const spd=e.speed*(e.slow>0?0.5:1);
      if(e.slow>0) e.slow-=dt;
      const target=this.path[e.pathIndex];
      if(!target){this.enemies.splice(i,1);continue;}
      const tx=target.x+0.5,ty=target.y+0.5;
      const dx=tx-e.x,dy=ty-e.y,dist=Math.hypot(dx,dy);
      if(dist<0.05){
        e.pathIndex++;
        if(e.pathIndex>=this.path.length){
          this.lives-=e.def.isBoss?5:1;
          this.enemies.splice(i,1);
          if(this.boss===e) this.boss=null;
          this._hud();
          if(this.lives<=0){
            document.getElementById('msg').textContent='💀 게임 오버';
            this.running=false;
          }
          continue;
        }
      } else {
        e.x+=(dx/dist)*spd*dt; e.y+=(dy/dist)*spd*dt;
      }
      if(e.hp<=0){
        this.gold+=Math.floor(e.def.reward*(PROJECT.difficulty.rewardScale||1));
        this.enemies.splice(i,1);
        if(this.boss===e) this.boss=null;
        this._hud();
      }
    }
    this.towers.forEach(t=>{
      t.cooldown-=dt; if(t.cooldown>0) return;
      let best=null,bd=Infinity;
      for(const e of this.enemies){
        if(e.def.type==='ground'&&!t.canAttackGround) continue;
        if(e.def.type==='air'&&!t.canAttackAir) continue;
        if(e.def.type==='ghost'&&!t.canAttackGhost) continue;
        const d=Math.hypot(e.x-(t.tx+0.5),e.y-(t.ty+0.5));
        if(d<=t.range&&d<bd){best=e;bd=d;}
      }
      if(best){
        t.cooldown=1/(t.attackSpeed||1);
        this.projectiles.push({x:t.tx+0.5,y:t.ty+0.5,target:best,speed:t.projectileSpeed||8,damage:t.damage,color:t.color,effects:t.effects||[]});
      }
    });
    for(let i=this.projectiles.length-1;i>=0;i--){
      const p=this.projectiles[i];
      if(!this.enemies.includes(p.target)||p.target.hp<=0){this.projectiles.splice(i,1);continue;}
      const dx=p.target.x-p.x,dy=p.target.y-p.y,dist=Math.hypot(dx,dy);
      if(dist<0.15){
        let dmg=p.damage-(p.target.def.armor||0); if(dmg<1) dmg=1;
        p.target.hp-=dmg;
        (p.effects||[]).forEach(ef=>{
          if(ef.type==='slow') p.target.slow=Math.max(p.target.slow,ef.value||1);
          if(ef.type==='poison') p.target.poison=Math.max(p.target.poison,ef.value||2);
          if(ef.type==='splash'){
            this.enemies.forEach(oe=>{
              if(oe===p.target) return;
              if(Math.hypot(oe.x-p.target.x,oe.y-p.target.y)<1.2) oe.hp-=dmg*0.4;
            });
          }
        });
        this.projectiles.splice(i,1);
      } else {
        p.x+=(dx/dist)*p.speed*dt; p.y+=(dy/dist)*p.speed*dt;
      }
    }
  }
  render(){
    const ctx=this.ctx, ts=this.ts;
    const {width,height,tiles}=PROJECT.map;
    ctx.fillStyle=PROJECT.meta.bgColor||'#1a1a2e';
    ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
    for(let y=0;y<height;y++) for(let x=0;x<width;x++){
      ctx.fillStyle=TILE_COLORS[tiles[y][x]]||'#2d6a4f';
      ctx.fillRect(x*ts,y*ts,ts,ts);
    }
    if(PROJECT.meta.showPath && this.path.length){
      ctx.strokeStyle=PROJECT.meta.pathColor||'#4a4a6a';
      ctx.lineWidth=ts*0.35; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath();
      this.path.forEach((p,i)=>{
        const px=p.x*ts+ts/2,py=p.y*ts+ts/2;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      });
      ctx.stroke();
    }
    this.towers.forEach(t=>{
      ctx.fillStyle=t.color;
      ctx.beginPath();
      ctx.arc(t.tx*ts+ts/2,t.ty*ts+ts/2,ts*0.35,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#fff'; ctx.font=(ts*0.3)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🗼',t.tx*ts+ts/2,t.ty*ts+ts/2);
    });
    this.enemies.forEach(e=>{
      const px=e.x*ts,py=e.y*ts;
      ctx.fillStyle=e.def.color;
      ctx.globalAlpha=e.def.type==='ghost'?0.75:1;
      ctx.beginPath();
      if(e.def.type==='air') ctx.ellipse(px,py,ts*0.3,ts*0.18,0,0,Math.PI*2);
      else ctx.arc(px,py,ts*0.28,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
      const barW=ts*0.5;
      ctx.fillStyle='#333'; ctx.fillRect(px-barW/2,py-ts*0.42,barW,4);
      ctx.fillStyle=e.def.isBoss?(e.def.bossBarColor||'#e63946'):'#00b894';
      ctx.fillRect(px-barW/2,py-ts*0.42,barW*(e.hp/e.maxHp),4);
    });
    if(this.boss&&this.boss.hp>0){
      const bw=this.canvas.width*0.6, bx=(this.canvas.width-bw)/2, by=10;
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx-4,by-4,bw+8,22);
      ctx.fillStyle='#333'; ctx.fillRect(bx,by,bw,14);
      ctx.fillStyle=this.boss.def.bossBarColor||'#e63946';
      ctx.fillRect(bx,by,bw*(this.boss.hp/this.boss.maxHp),14);
      ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.textAlign='center';
      ctx.fillText('👑 '+this.boss.def.name,this.canvas.width/2,by+11);
    }
    this.projectiles.forEach(p=>{
      ctx.fillStyle=p.color||'#fdcb6e';
      ctx.beginPath(); ctx.arc(p.x*ts,p.y*ts,4,0,Math.PI*2); ctx.fill();
    });
    if(this.selected&&this.hover){
      ctx.strokeStyle='rgba(0,206,201,0.8)'; ctx.lineWidth=2;
      ctx.strokeRect(this.hover.x*ts+2,this.hover.y*ts+2,ts-4,ts-4);
      ctx.beginPath();
      ctx.arc(this.hover.x*ts+ts/2,this.hover.y*ts+ts/2,this.selected.range*ts,0,Math.PI*2);
      ctx.strokeStyle='rgba(108,92,231,0.35)'; ctx.stroke();
    }
  }
  _hud(){
    document.getElementById('gold').textContent=this.gold;
    document.getElementById('lives').textContent=this.lives;
    document.getElementById('wave').textContent=Math.max(0,this.waveIndex+1)+' / '+PROJECT.waves.length;
  }
  _loop(now){
    if(!this._last) this._last=now;
    const dt=Math.min(0.05,(now-this._last)/1000);
    this._last=now;
    this.update(dt);
    this.render();
    requestAnimationFrame(t=>this._loop(t));
  }
}

new Game();
<\/script>

}

function downloadHTML(project) {
  const html = buildPlayableHTML(project);
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${sanitize(project.meta.name || 'td-game')}.html`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function sanitize(name) {
  return name.replace(/[^\w\uac00-\ud7a3\- ]+/g, '').trim().replace(/\s+/g, '-') || 'td-game';
}

function escapeHtmlExport(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function refreshMapSelect() {
  const sel = $('#mapSelect');

  ).join('');

function refreshUpgradeTowerSelect() {
  const sel = $('#upgradeTowerSelect');
  sel.innerHTML = '<option value="">타워 선택</option>' +
    project.towers.map(t => `<option value="${t.id}">${t.emoji || '🗼'} ${t.name}</option>`).join('');
  sel.onchange = () => upgradeEditor.setTower(sel.value ? +sel.value : null);
}

function bindSettings() {
  const map = {
    gameName: ['meta', 'name'], authorName: ['meta', 'author'], gameVersion: ['meta', 'version'],
    gameDesc: ['meta', 'description'], tileSize: ['meta', 'tileSize'], maxTowers: ['meta', 'maxTowers'],
    allowSell: ['meta', 'allowSell'], showPath: ['meta', 'showPath'],
    bgColor: ['meta', 'bgColor'], pathColor: ['meta', 'pathColor'], enableParticles: ['meta', 'enableParticles'],
  };
  Object.entries(map).forEach(([id, path]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener(el.type === 'checkbox' || el.type === 'color' ? 'change' : 'input', () => {
      let val = el.type === 'checkbox' ? el.checked : el.type === 'number' ? parseFloat(el.value) : el.value;
      project[path[0]][path[1]] = val;
      if (id === 'gameName') {
        project.meta.name = val;
        if (project.mainMenu) project.mainMenu.title = val;
        renderMenuEditor();
      }
      updateStatus();
    });
  });
  syncSettingsToUI();
}

function syncSettingsToUI() {
  const m = project.meta;
  const set = (id, v) => { const el = document.getElementById(id); if (el) { if (el.type === 'checkbox') el.checked = !!v; else el.value = v ?? ''; } };
  set('gameName', m.name); set('authorName', m.author); set('gameVersion', m.version);
  set('gameDesc', m.description); set('tileSize', m.tileSize || 48); set('maxTowers', m.maxTowers);
  set('allowSell', m.allowSell); set('showPath', m.showPath); set('bgColor', m.bgColor);
  set('pathColor', m.pathColor); set('enableParticles', m.enableParticles);
  set('mapWidth', project.map?.width); set('mapHeight', project.map?.height);
}

function migrateProject(p) {
  if (!p.maps) {
    p.maps = [p.map || createMapData(1, '맵 1', 24, 16)];
    p.activeMapId = p.maps[0].id;
  }
  syncActiveMap(p);
  if (!p.difficulties) {
    p.difficulties = [{
      id: 1, name: '기본', startGold: p.difficulty?.startGold || 500,
      startLives: p.difficulty?.startLives || 20, hpScale: p.difficulty?.hpScale || 1,
      speedScale: p.difficulty?.speedScale || 1, rewardScale: p.difficulty?.rewardScale || 1,
      waves: p.waves || [], collapsed: false, mapId: null,
    }];
  }
  if (!p.mainMenu) {
    p.mainMenu = {
      title: p.meta?.name || 'Game', subtitle: '', bgColor: '#0f0f1a', titleColor: '#fff',
      buttons: [{ id: 'play', label: '게임 시작', action: 'play' }],
    };
  }
  (p.towers || []).forEach(t => { if (!t.emoji) t.emoji = '🗼'; });
  (p.enemies || []).forEach(e => { if (!e.emoji) e.emoji = '👾'; });

  if (diff.mapId) {
    project.activeMapId = diff.mapId;
    syncActiveMap(project);
  }
  if (!mapEditor.findPath()) {
    alert('스폰→엔드 경로가 없습니다. 맵을 확인하세요.');
    return;
  }
  // temp difficulty for engine
  const playProject = {
    ...project,
    map: project.map,
    difficulty: {
      startGold: diff.startGold,
      startLives: diff.startLives,
      hpScale: diff.hpScale,
      speedScale: diff.speedScale,
      rewardScale: diff.rewardScale,
    },
    waves: diff.waves,
  };

  const sel = $('#previewDiffSelect');
  sel.innerHTML = project.difficulties.map(d =>
    `<option value="${d.id}" ${d.id===diff.id?'selected':''}>${d.name}</option>`
  ).join('');

  $('#previewOverlay').classList.remove('hidden');
  if (previewEngine) previewEngine.stop();
  previewEngine = new GameEngine($('#previewCanvas'), playProject, {
    gold: $('#pGold'), lives: $('#pLives'), wave: $('#pWave'),
  });
  previewEngine.selectedTowerType = project.towers[0] || null;
  previewEngine.start();
};

$('#previewDiffSelect')?.addEventListener('change', () => {
  // restart preview with new diff
  $('#btnClosePreview').click();
  setTimeout(() => $('#btnPreview').click(), 100);
});

$('#btnClosePreview').onclick = () => {
  previewEngine?.stop();
  previewEngine = null;
  $('#previewOverlay').classList.add('hidden');
};
$('#btnStartWave').onclick = () => previewEngine?.startNextWave();
$('#btnPausePreview').onclick = () => previewEngine?.togglePause();

$('#btnExport').onclick = () => {
  $('#exportOverlay').classList.remove('hidden');
  $('#exportCode').value = projectToJSON(project);
};
$('#btnCloseExport').onclick = () => $('#exportOverlay').classList.add('hidden');
$('#btnDownloadJSON').onclick = () => { downloadJSON(project); setStatus('JSON 다운로드'); };
$('#btnDownloadHTML').onclick = () => { downloadHTML(project); setStatus('HTML 다운로드'); };
$('#btnCopyCode').onclick = async () => {
  const code = buildPlayableHTML(project);
  $('#exportCode').value = code;
  try { await navigator.clipboard.writeText(code); setStatus('복사됨'); }
  catch { setStatus('복사 실패 — 직접 선택하세요'); }
};

function boot() {
  try {
    initEditors();
    updateStatus();
    if (!localStorage.getItem('td-maker-project')) {
      const basic = TEMPLATES.find(t => t.id === 'basic');
      if (basic) {
        basic.apply(project);
        syncAllEditors();
        setStatus('기본 템플릿 로드됨');
      }
    }
  } catch (err) {
    console.error(err);
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#a00;color:#fff;padding:12px;z-index:99999;';
    d.textContent = '초기화 오류: ' + (err && err.message ? err.message : err);
    document.body.appendChild(d);
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();


</script>
</body>
</html>
